[project]
name = "iris-z"
version = "0.1.0"
description = "Iris-Z: one generative model for images and their depth"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "torch==2.9.1",
    "torchvision==0.24.1",
    "transformers==4.57.6",  # 5.x needs the separate `kernels` package for the FP8 Qwen3 text encoder
    "accelerate>=1.0",
    "huggingface_hub>=0.34",
    "safetensors>=0.4",
    "einops>=0.8",
    "numpy>=1.26",
    "pillow>=10.0",
    "matplotlib>=3.8",
    "scipy>=1.11",
]

[project.optional-dependencies]
demo = ["gradio==5.49.1", "spaces"]

# torch and torchvision come from the PyTorch CUDA 13.0 wheel index (the build the release was tested with)
[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["iris_z"]

[tool.ruff]
line-length = 120
extend-exclude = ["iris_z/model", "*.md"]
